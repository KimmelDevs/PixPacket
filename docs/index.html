<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixPacket</title>
<meta name="description" content="PixPacket: pixel art and animation for Android, made for your fingers.">
<link rel="icon" href="logo.png">
<style>
  :root { --bg: #f4f3f8; --text: #1b1b21; --muted: #55536a; --accent: #0055bf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15151c; --text: #e6e4ee; --muted: #b4b1c2; --accent: #8ab4ff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px; text-align: center; }
  img { width: 96px; height: 96px; background: #fff; border-radius: 24px; padding: 10px; }
  h1 { margin: 16px 0 4px; font-size: 2.2rem; }
  p { color: var(--muted); }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="PixPacket logo">
  <h1>PixPacket</h1>
  <p>Pixel art &amp; animation for Android, made for your fingers.</p>
  <p><a href="privacy-policy.html">Privacy Policy</a> · <a href="https://github.com/KimmelDevs/PixPacket">Source on GitHub</a></p>
</main>
</body>
</html>
